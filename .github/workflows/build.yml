name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DGAMEPAD_DEVICE=flydigi_desert_fox
      - run: cmake --build build --config Release --parallel
      - run: cmake --build build --config Release --target gamepad_easysmx_d15_dune_8k gamepad_flydigi_direwolf_4 gamepad_generic_xinput
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix install
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/linux-core -DCMAKE_BUILD_TYPE=Debug -DGAMEPAD_DEVICE=easysmx_d15_dune_8k -DGAMEPAD_SANITIZERS=ON
      - run: cmake --build build/linux-core --parallel
      - run: ctest --test-dir build/linux-core --output-on-failure
